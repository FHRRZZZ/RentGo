    <!-- Wordmark for Dark Background -->
    <text x="52" y="27" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="23" fill="#FFFFFF" letter-spacing="-0.8">Rent<tspan fill="#F5B800">Go</tspan></text>
