        <!-- Upper loop -->
        <path d="M14.5 8H22.5C26 8 28.5 10.2 28.5 13.8C28.5 17.2 26 19.5 22.5 19.5H14.5V8ZM14.5 16H21.5C23 16 23.8 15 23.8 13.8C23.8 12.5 23 11.5 21.5 11.5H14.5V16Z"/>
