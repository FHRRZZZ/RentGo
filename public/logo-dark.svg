<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 40" fill="none">
    <!-- Icon Emblem -->
    <rect width="40" height="40" rx="8" fill="#F5B800" />
    <g>
        <!-- Dynamic Racing V Emblem -->
        <path d="M10 11L16.5 11L19.5 24L14 24Z" fill="#111111" />
        <path d="M23.5 11L30 11L21 29L17.5 29Z" fill="#111111" />
        <!-- Speed arrow dart crossing V -->
        <polygon points="8,21 28,18 20,23" fill="#FFFFFF" opacity="0.95" />
        <polygon points="12,21 28,18 21,22.5" fill="#111111" />
    </g>

    <!-- Wordmark for Dark Background -->
    <text x="50" y="28" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="24" letter-spacing="-0.8"><tspan fill="#F5B800">V</tspan><tspan fill="#FFFFFF">Rent</tspan></text>
</svg>
